# Include from nginx's http context (e.g. /etc/nginx/conf.d/pathlab.conf).
# Replace lab.example.edu with your real domain or public IP, and install a
# certificate whose subjectAltName matches that address.
# Allow classroom NAT traffic (each manual run sends several actions/second).
limit_req_zone $binary_remote_addr zone=pathlab_requests:10m rate=300r/s;
limit_conn_zone $binary_remote_addr zone=pathlab_connections:10m;
map $http_upgrade $pathlab_connection {
    default upgrade;
    '' close;
}
server {
    listen 80;
    server_name lab.example.edu;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    server_name lab.example.edu;
    ssl_certificate /etc/ssl/pathlab/fullchain.pem;
    ssl_certificate_key /etc/ssl/pathlab/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 36m;
    client_body_timeout 30s;
    limit_req zone=pathlab_requests burst=600 nodelay;
    limit_req_status 429;
    # Classroom NAT may share one IP; do not set this to a single student's limit.
    limit_conn pathlab_connections 400;
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $pathlab_connection;
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
    }
}
