# Place in /etc/nginx/conf.d/pathlab.conf; replace lab.example.edu and certificate paths.
# Domain/DNS and the university firewall must be configured by the administrator.
limit_req_zone $binary_remote_addr zone=pathlab_requests:10m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=pathlab_connections:10m;
map $http_upgrade $pathlab_connection { default upgrade; '' close; }

server {
    listen 80;
    server_name lab.example.edu;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    server_name lab.example.edu;
    ssl_certificate /etc/ssl/pathlab/fullchain.pem;
    ssl_certificate_key /etc/ssl/pathlab/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 130m;
    client_body_timeout 30s;
    send_timeout 90s;
    limit_conn pathlab_connections 32;
    limit_req zone=pathlab_requests burst=60 nodelay;
    limit_req_status 429;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; connect-src 'self'; frame-ancestors 'none'; object-src 'none'; base-uri 'self'" always;
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $pathlab_connection;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 120s;
    }
}
